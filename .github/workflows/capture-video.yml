name: Capture Video Stream Link

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "Video details page URL"
        required: false
        default: "http://103.203.93.2/video-details/1744915"
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write  # রিপোজিটরিতে video_links.txt পুশ করার জন্য প্রয়োজন

jobs:
  capture:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Run video link capture script
        env:
          TARGET_URL: ${{ inputs.target_url || 'http://103.203.93.2/video-details/1744915' }}
        run: |
          python capture_video.py
          ls -la video_links.txt

      - name: Upload video_links.txt artifact
        uses: actions/upload-artifact@v4
        with:
          name: captured-video-links-txt
          path: video_links.txt
          if-no-files-found: error

      - name: Commit and push video_links.txt to root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add video_links.txt
          if ! git diff --staged --quiet; then
            git commit -m "Update captured video links in video_links.txt"
            git push
          else
            echo "No changes in video_links.txt"
          fi
